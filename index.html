<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrobras - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="check">✓</div>
            <h1>Login realizado!</h1>
            <p>Autenticação concluída.</p>
            
            <div class="token">dG9rZW4tMTQ4</div>

            <div class="timer">
                Expira em: <span id="s">120</span>s
            </div>
        </div>
    </div>

    <script>
        let t = 120;
        const display = document.getElementById('s');
        setInterval(() => { 
            if(t > 0) {
                t--; 
                display.innerText = t; 
            }
        }, 1000);
    </script>
</body>
</html>
