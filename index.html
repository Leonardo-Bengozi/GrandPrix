<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrobras - Login Confirmado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-petrobras">
        <div class="check">✓</div>
        <h2>Login realizado!</h2>
        <p class="status">Autenticação concluída.</p>
        
        <span class="token" id="tokenCode">dG9rZW4tMTQ4</span>
        
        <div class="timer">
            Expira em: <span id="s">120</span>s
        </div>
    </div>

    <script>
        let t = 120;
        const display = document.getElementById('s');
        setInterval(() => { 
            if(t > 0) {
                t--; 
                display.innerText = t; 
            }
        }, 1000);
    </script>
</body>
</html>
