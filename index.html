<script>
    function gerarToken() {
        const agora = Date.now();

        // bloco de 2 minutos (120000 ms)
        const blocoTempo = Math.floor(agora / 120000);

        return btoa("token-" + blocoTempo).substring(0, 12);
    }

    function atualizarSistema() {
        const agora = Date.now();

        // calcula quanto falta para o próximo ciclo de 2 minutos
        const resto = 120000 - (agora % 120000);
        const segundos = Math.floor(resto / 1000);

        // gera token
        const token = gerarToken();

        // atualiza tela
        document.getElementById("token").innerText = token;
        document.getElementById("contador").innerText = segundos;

        // atualiza link
        const link = document.querySelector(".btn-continuar");
        link.href = "https://leonardo-bengozi.github.io/GrandPrix/?token=" + token;
    }

    // atualiza a cada 1 segundo (sem conflito)
    setInterval(atualizarSistema, 1000);

    // roda imediatamente ao carregar
    atualizarSistema();
</script>
