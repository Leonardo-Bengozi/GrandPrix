<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Confirmado</title>
    <style>
        /* Estilos para criar o fundo roxo e o card centralizado */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        .icon-check {
            width: 60px;
            height: 60px;
            background-color: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Estilo específico para o Token */
        .token-label {
            font-weight: bold;
            color: #333;
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .token-area {
            background: #f4f7f6;
            padding: 15px;
            border: 2px dashed #cbd5e0;
            border-radius: 10px;
            color: #2575fc;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            word-break: break-all;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-check">✓</div>
        <h1>Login realizado!</h1>
        <p>Sua autenticação foi concluída com sucesso.</p>

        <span class="token-label">Seu Token de Acesso:</span>
        <div class="token-area">
            7X9-B2Z-KK1-2026
        </div>
    </div>

</body>
</html>
