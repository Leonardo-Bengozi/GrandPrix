<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Petrobras - Login Confirmado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h2>Login realizado!</h2>
        <p>Autenticação concluída.</p>
        <span class="token">dG9rZW4tMTQ4</span>
        <div class="timer">Expira em: <span id="s">120</span>s</div>
    </div>
    
    <script>
        let t = 120;
        setInterval(() => { 
            if(t > 0) t--; 
            document.getElementById('s').innerText = t; 
        }, 1000);
    </script>
</body>
</html>
