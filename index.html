<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Confirmado</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="card-confirmacao">
        <div class="sucesso-icon">
            <i class="ph ph-check-circle"></i>
        </div>

        <h1>Login realizado!</h1>
        <p>Bem-vindo de volta. Você foi autenticado com sucesso em nossa plataforma.</p>

        <!-- TOKEN VISUAL -->
        <p><strong>Token atual:</strong></p>
        <p id="token" style="font-size: 18px; color: #00bcd4;"></p>

        <!-- CONTADOR -->
        <p>Expira em: <span id="contador">120</span>s</p>

        <a href="#" class="btn-continuar">Ir para o Dashboard</a>
        <button onclick="window.history.back()" class="btn-voltar">Sair</button>
    </div>

    <script>
        let tempoRestante = 120;

        function gerarToken() {
            const agora = new Date();
            const blocoTempo = Math.floor(agora.getTime() / (1000 * 60 * 2));
            
            return btoa("token-" + blocoTempo).substring(0, 12);
        }

        function atualizarTudo() {
            const token = gerarToken();

            document.getElementById("token").innerText = token;

            const link = document.querySelector(".btn-continuar");
            link.href = "https://leonardo-bengozi.github.io/GrandPrix/?token=" + token;

            tempoRestante = 120;
        }

        function atualizarContador() {
            tempoRestante--;
            document.getElementById("contador").innerText = tempoRestante;

            if (tempoRestante <= 0) {
                atualizarTudo();
            }
        }

        // inicia
        atualizarTudo();

        // contador a cada segundo
        setInterval(atualizarContador, 1000);

        // garante atualização a cada 2 min
        setInterval(atualizarTudo, 120000);
    </script>
</body>
</html>
