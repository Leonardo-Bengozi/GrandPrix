<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Confirmado</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        .icon-check {
            width: 60px;
            height: 60px;
            border: 4px solid #2ecc71;
            color: #2ecc71;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            color: #1a202c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.description {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .token-label {
            font-weight: bold;
            color: #4a5568;
            display: block;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .token-value {
            color: #00bcd4;
            font-size: 28px;
            font-family: 'Segoe UI', sans-serif;
            margin-bottom: 10px;
            display: block;
            word-break: break-all;
        }

        .expire-text {
            color: #a0aec0;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-check">✓</div>
        <h1>Login realizado!</h1>
        <p class="description">Bem-vindo de volta. Você foi autenticado com sucesso em nossa plataforma.</p>

        <span class="token-label">Token atual:</span>
        <span class="token-value">dG9rZW4tMTQ4</span>
        
        <div class="expire-text">
            Expira em: 112s
        </div>
    </div>

</body>
</html>
