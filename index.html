<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Acesso</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
        }

        .icon-check {
            width: 60px;
            height: 60px;
            border: 4px solid #2ecc71;
            color: #2ecc71;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            color: #1a202c;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.description {
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .token-label {
            font-weight: bold;
            color: #4a5568;
            display: block;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .token-value {
            color: #00bcd4;
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* AJUSTE AQUI: Texto do timer mais escuro */
        .timer-container {
            color: #2d3748; /* Cinza escuro/quase preto */
            font-size: 15px;
            font-weight: 500;
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
        }

        #seconds {
            font-weight: bold;
            color: #e53e3e; /* Vermelho para o número */
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-check">✓</div>
        <h1>Login realizado!</h1>
        <p class="description">Sua autenticação foi concluída com sucesso.</p>

        <span class="token-label">Token atual:</span>
        <span class="token-value">dG9rZW4tMTQ4</span>
        
        <div class="timer-container">
            Expira em: <span id="seconds">120</span>s
        </div>
    </div>

    <script>
        let tempo = 120;
        const display = document.getElementById('seconds');

        const contagem = setInterval(() => {
            tempo--;
            display.innerText = tempo;

            if (tempo <= 0) {
                clearInterval(contagem);
                display.innerText = "0";
            }
        }, 1000);
    </script>

</body>
</html>
